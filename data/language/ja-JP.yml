  # Tutorial 1
  1882: "{SMALLFONT}{COLOUR BLACK}都市内の乗客を運ぶバス路線を作ります。まず都市を選びましょう…"
  1883: "{SMALLFONT}{COLOUR BLACK}右ボタンを押したままマウスを動かして画面をスクロールし、都市を見てみましょう…"
  1884: "{SMALLFONT}{COLOUR BLACK}Boulders Bayが最も大きな都市なので、乗客も最も多く集まります。マウスホイールか拡大アイコンで拡大しましょう…"
  1885: "{SMALLFONT}{COLOUR BLACK}道路に関する建設はすべて道路建設ウィンドウで行います…"
  1886: "{SMALLFONT}{COLOUR BLACK}このバス路線では新しい道路は不要で、バス停だけ置けば十分です…"
  1887: "{SMALLFONT}{COLOUR BLACK}バス路線は都市の端から端へ走ります…"
  1888: "{SMALLFONT}{COLOUR BLACK}青く強調された範囲が駅の駅勢圏です。駅勢圏内の建物が多いほど、より多くの乗客が駅を使います…"
  1889: "{SMALLFONT}{COLOUR BLACK}駅の位置が乗客を取り扱うか確認してください。取り扱わないと乗客を下ろせず収入も得られません。建設ウィンドウ下部の「駅勢圏」の文字を見てください…"
  1890: "{SMALLFONT}{COLOUR BLACK}場所が決まったら、左クリックで駅を建設します…"
  1891: "{SMALLFONT}{COLOUR BLACK}2つ目の駅は都市の反対側に建設します…"
  1892: "{SMALLFONT}{COLOUR BLACK}次にバスを購入します…"
  1893: "{SMALLFONT}{COLOUR BLACK}バスは2種類あります。より多くの乗客を運べる新しい設計を選びましょう…"
  1894: "{SMALLFONT}{COLOUR BLACK}マウスカーソルを動かしてバスを道路上に置き、左クリックで配置します…"
  1895: "{SMALLFONT}{COLOUR BLACK}バスを走らせる前に行き先を教える必要があります。車両ウィンドウの経路詳細タブを選びましょう…"
  1896: "{SMALLFONT}{COLOUR BLACK}経路を設定するには、画面上の駅をクリックするだけです…"
  1897: "{SMALLFONT}{COLOUR BLACK}これでバスを出発させられます…"
  1898: "{SMALLFONT}{COLOUR BLACK}最初の乗客を乗せる様子を見てみましょう…"

  # Tutorial 2
  1899: "{SMALLFONT}{COLOUR BLACK}Boulder BayとBreakers Bridgeの間で乗客を運ぶバス路線を作ります。都市を結ぶ道路がないので、新しく建設する必要があります…"
  1900: "{SMALLFONT}{COLOUR BLACK}新しい道路区間の向きを選び、画面をクリックして建設を開始します…"
  1901: "{SMALLFONT}{COLOUR BLACK}「これを建設」アイコンをクリックすると、同じ種類の道路区間を追加できます…"
  1902: "{SMALLFONT}{COLOUR BLACK}続ける前に、道路建設を始めるもっと速い方法を紹介します…"
  1903: "{SMALLFONT}{COLOUR BLACK}延長したい道路の端を右クリックするだけです…"
  1904: "{SMALLFONT}{COLOUR BLACK}ここで左に曲がる必要があるので、左カーブを選びます…"
  1905: "{SMALLFONT}{COLOUR BLACK}そして再び直線の建設に戻ります…"
  1906: "{SMALLFONT}{COLOUR BLACK}道路は完成です。次は駅です…"
  1907: "{SMALLFONT}{COLOUR BLACK}最後にバスを購入して走らせましょう…"
  1908: "{SMALLFONT}{COLOUR BLACK}忙しい路線になりそうなので、2台目のバスも買います…"
  1909: "{SMALLFONT}{COLOUR BLACK}バス1の経路全体をバス2にすばやくコピーするには、バス1の「経路リストの末尾」の文字をクリックします…"

  # Tutorial 3
  1910: "{SMALLFONT}{COLOUR BLACK}まず、最も大きな2つの都市を結ぶ鉄道旅客路線を建設しましょう…"
  1911: "{SMALLFONT}{COLOUR BLACK}鉄道駅は直線の線路にしか建設できず、列車の長さに対して十分な長さが必要です。数分後にここに駅を1つ建設します…"
  1912: "{SMALLFONT}{COLOUR BLACK}次は駅を建設します…"
  1913: "{SMALLFONT}{COLOUR BLACK}次は列車です。列車を引く機関車と、乗客を乗せる客車が必要です…"
  1914: "{SMALLFONT}{COLOUR BLACK}線路は単線なので、経路を設定する必要はありません。列車を出発させるだけです…"
  1915: "{SMALLFONT}{COLOUR BLACK}線路を延長して分岐を作り、3つ目の都市へ支線を伸ばしましょう。線路を右クリックすると線路建設ウィンドウが開き、分岐を建設できます…"
  1916: "{SMALLFONT}{COLOUR BLACK}線路の形が単純ではなくなったので、列車に経路を設定する必要があります…"
  1917: "{SMALLFONT}{COLOUR BLACK}2本目の列車を追加できますが、先に衝突を防ぐ信号機を建設する必要があります…"
  1918: "{SMALLFONT}{COLOUR BLACK}信号機が線路を3つの独立した「閉塞区間」に分け、各区間には一度に1本の列車しか入れません…"

