  1886: "{SMALLFONT}{COLOUR BLACK}Per a aquest servei no cal construir carreteres noves, només parades d'autobús..."
  1887: "{SMALLFONT}{COLOUR BLACK}El nostre servei anirà d'un extrem de la ciutat a l'altre..."
  1888: "{SMALLFONT}{COLOUR BLACK}La zona ressaltada en blau és l'àrea de cobertura de l'estació. Com més edificis hi hagi dins d'aquesta àrea, més passatgers faran servir l'estació..."
  1889: "{SMALLFONT}{COLOUR BLACK}Comproveu que la ubicació de l'estació accepta passatgers; si no, no els podreu descarregar ni rebreu diners a canvi. Observeu el text «Àrea de cobertura» a la part inferior de la finestra de construcció..."
  1890: "{SMALLFONT}{COLOUR BLACK}Quan estigueu satisfet amb la ubicació, feu clic amb el botó esquerre per a construir l'estació..."
  1891: "{SMALLFONT}{COLOUR BLACK}Ara construirem la segona estació a l'altre costat de la ciutat..."
  1892: "{SMALLFONT}{COLOUR BLACK}Ara hem de comprar un autobús..."
  1893: "{SMALLFONT}{COLOUR BLACK}Podem triar entre dos models. Escollim el més modern, que pot transportar més passatgers..."
  1894: "{SMALLFONT}{COLOUR BLACK}Moveu el cursor a una carretera i feu clic amb el botó esquerre per a col·locar-hi l'autobús..."
  1895: "{SMALLFONT}{COLOUR BLACK}Abans de posar-lo en marxa, cal indicar-li el recorregut. Seleccioneu la pestanya d'itinerari a la finestra del vehicle..."
  1896: "{SMALLFONT}{COLOUR BLACK}Per a definir el recorregut, només cal fer clic al damunt de les estacions de la vista..."
  1897: "{SMALLFONT}{COLOUR BLACK}Ara ja podem posar l'autobús en marxa..."
  1898: "{SMALLFONT}{COLOUR BLACK}Observem finalment com recull els seus primers passatgers..."

  # Tutorial 2
  1899: "{SMALLFONT}{COLOUR BLACK}Construirem un servei d'autobús entre Boulder Bay i Breakers Bridge. Com que no hi ha cap carretera entre les dues ciutats, n'haurem de construir una..."
  1900: "{SMALLFONT}{COLOUR BLACK}Seleccioneu l'orientació del nou tram de carretera i feu clic a la vista per a començar-ne la construcció..."
  1901: "{SMALLFONT}{COLOUR BLACK}Si feu clic a la icona «Construeix-ho, s'afegiran més trams de carretera del mateix tipus..."
  1902: "{SMALLFONT}{COLOUR BLACK}Abans de continuar, aquí teniu una manera més ràpida d'iniciar la construcció de carreteres..."
  1903: "{SMALLFONT}{COLOUR BLACK}Només cal fer clic amb el botó dret sobre l'extrem de la carretera que voleu allargar..."
  1904: "{SMALLFONT}{COLOUR BLACK}Aquí hem de girar a l'esquerra, així que seleccioneu una corba cap a l'esquerra..."
  1905: "{SMALLFONT}{COLOUR BLACK}I ara continuem construint en línia recta..."
  1906: "{SMALLFONT}{COLOUR BLACK}Ja tenim la carretera. Ara toca construir les estacions..."
  1907: "{SMALLFONT}{COLOUR BLACK}Finalment, comprarem un autobús i el posarem en servei..."
  1908: "{SMALLFONT}{COLOUR BLACK}Aquesta ruta pot arribar a ser molt transitada, així que comprarem un segon autobús..."
  1909: "{SMALLFONT}{COLOUR BLACK}Per a copiar ràpidament tot l'itinerari de l'Autobús 1 a l'Autobús 2, només cal fer clic al text «fi de la llista d'itinerari» de l'Autobús 1..."

  # Tutorial 3
  1910: "{SMALLFONT}{COLOUR BLACK}Hem de construir un servei ferroviari de passatgers entre les dues ciutats més grans..."
  1911: "{SMALLFONT}{COLOUR BLACK}Les estacions de tren només es poden construir sobre vies rectes i han de tenir prou longitud per al nostre tren. D'aquí a uns instants en construirem una aquí..."
  1912: "{SMALLFONT}{COLOUR BLACK}Ara construirem les estacions..."
  1913: "{SMALLFONT}{COLOUR BLACK}Ara comprarem el tren. Necessitarem una locomotora per a arrossegar el tren i vagons per a transportar passatgers..."
  1914: "{SMALLFONT}{COLOUR BLACK}Com que la via és d'una sola línia, no cal definir cap itinerari. Només cal posar el tren en marxa..."
  1915: "{SMALLFONT}{COLOUR BLACK}Allarguem la via per a crear un encreuament i un ramal cap a la tercera ciutat. Si feu clic amb el botó dret sobre la via, s'obrirà la finestra de construcció de vies preparada per a crear l'encreuament..."
  1916: "{SMALLFONT}{COLOUR BLACK}Ara que el traçat de la via ja no és tan senzill, cal definir un itinerari per al nostre tren..."
  1917: "{SMALLFONT}{COLOUR BLACK}Ara podríem afegir un segon tren, però abans hem d'afegir-hi senyals per a evitar que xoquin..."
  1918: "{SMALLFONT}{COLOUR BLACK}Els senyals divideixen la via en tres blocs independents i faran que només hi pugui haver un sol tren a cada ramal..."

