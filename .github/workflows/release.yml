name: Draft Release

on:
  push:
    tags:
      - 'v*'

jobs:
  draft-release:
    name: Create Draft Release & Attach Artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get Tag & Version Information
        id: vars
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          VERSION=${TAG_NAME#v}
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Extract Release Notes from Tag
        id: tag_notes
        run: |
          git fetch --tags --force
          NOTES=$(git tag -l --format='%(contents)' ${{ steps.vars.outputs.tag_name }})
          # Store multi-line output into GITHUB_OUTPUT
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # Download all artifacts built in the concurrent CI workflow
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: download-artifacts/

      # -----------------------------------------------------------------
      # SKELETON: Customize your artifact naming/archiving rules here
      # -----------------------------------------------------------------
      - name: Format and Package Release Artifacts
        run: |
          mkdir release-packages
          VERSION="${{ steps.vars.outputs.version }}"

          cd download-artifacts

          # Loop through each uploaded artifact directory
          for dir in *; do
            if [ -d "$dir" ]; then
              # Customize artifact naming convention here
              # Example: OpenLoco-windows-2022-x64 -> OpenLoco-v24.05-windows-2022-x64.zip
              ZIP_NAME="${dir}-${VERSION}.zip"

              echo "Packaging $dir into ${ZIP_NAME}..."
              (cd "$dir" && zip -r "../../release-packages/${ZIP_NAME}" .)
            fi
          done

      - name: Create Draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag_name }}
          name: ${{ steps.vars.outputs.tag_name }}
          body: ${{ steps.tag_notes.outputs.notes }}
          draft: true
          prerelease: false
          files: release-packages/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}